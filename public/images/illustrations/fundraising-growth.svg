<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="fr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B1F9A"/>
      <stop offset="100%" stop-color="#170A50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fr-bg)"/>
  <!-- Grid lines -->
  <line x1="80" y1="140" x2="560" y2="140" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
  <line x1="80" y1="220" x2="560" y2="220" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
  <line x1="80" y1="300" x2="560" y2="300" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
  <line x1="80" y1="370" x2="560" y2="370" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
  <!-- Bar chart — growing series -->
  <rect x="100" y="320" width="46" height="50" rx="4" fill="rgba(255,255,255,0.13)"/>
  <rect x="164" y="290" width="46" height="80" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="228" y="255" width="46" height="115" rx="4" fill="rgba(100,92,255,0.5)"/>
