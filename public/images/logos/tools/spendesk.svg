<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#F8F9FA"/>

  <!-- Spendesk logo: Red circle with white S -->
  <circle cx="100" cy="100" r="85" fill="#E11D48"/>

  <!-- S letter -->
  <text x="100" y="120" font-size="80" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" font-family="'Helvetica Neue', Arial, sans-serif">S</text>

  <!-- Company name -->
  <text x="100" y="180" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">Spendesk</text>
</svg>
