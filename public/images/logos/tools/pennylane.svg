<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#F8F9FA"/>

  <!-- Pennylane logo: Blue circle with white P -->
  <circle cx="100" cy="100" r="85" fill="#1E40AF"/>

  <!-- P letter -->
  <text x="100" y="120" font-size="80" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" font-family="'Helvetica Neue', Arial, sans-serif">P</text>

  <!-- Company name -->
  <text x="100" y="180" font-size="12" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">Pennylane</text>
</svg>