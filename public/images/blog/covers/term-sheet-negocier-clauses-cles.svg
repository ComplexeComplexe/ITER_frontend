      <path d="M 70.4 110 L 105.6 136.4 L 127.6 123.20000000000002 L 154 136.4"/>
      <line x1="39.6" y1="92.39999999999999" x2="26.4" y2="140.8"/>
      <line x1="180.39999999999998" y1="101.2" x2="193.6" y2="145.20000000000002"/>
    </g>
    </g>
    <rect x="0" y="0" width="92" height="30" fill="#E08530"/>
    <text x="46" y="20" fill="white" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" text-anchor="middle">FIG. 11</text>
