<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- masthead -->
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#0F1740" stroke-width="1" opacity="0.15"/>
  <text x="60" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3">ITER ADVISORS</text>
  <text x="1140" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3" text-anchor="end">VOL. 01 · 2026 · N° 13</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#0F1740" stroke-width="3"/>

  <!-- kicker + category badge -->
  <text x="60" y="115" fill="#2EC4B6" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3">LEVIERS</text>
  <rect x="60" y="135" width="127" height="34" rx="17" fill="#D4F1EC"/>
  <text x="123.5" y="157" fill="#0E5E54" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" text-anchor="middle">TRESORERIE</text>

  <!-- huge serif title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0F1740">
    <text x="60" y="230" font-size="72" font-weight="500" letter-spacing="-2">Reduire son BFR</text>
  </g>

  <!-- accent rule under title -->
  <line x1="60" y1="248" x2="120" y2="248" stroke="#2EC4B6" stroke-width="4"/>

  <!-- italic subtitle -->
  <g font-family="Georgia, serif" fill="#4B5563" font-style="italic">
