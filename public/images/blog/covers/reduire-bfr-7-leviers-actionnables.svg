    <text x="60" y="314" font-size="24" font-weight="400">tout</text>
  </g>

  <!-- illustration block, right -->
  <g transform="translate(780 220)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="#D4F1EC"/>
    <g transform="translate(70 70)">
      <g stroke="#0E5E54" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="39.6" y1="176" x2="180.39999999999998" y2="176"/>
      <line x1="61.60000000000001" y1="176" x2="61.60000000000001" y2="110"/>
      <line x1="110" y1="176" x2="110" y2="66"/>
      <line x1="158.4" y1="176" x2="158.4" y2="132"/>
      <circle cx="61.60000000000001" cy="110" r="7.700000000000001" fill="#0E5E54"/>
      <circle cx="110" cy="66" r="7.700000000000001" fill="#0E5E54"/>
      <circle cx="158.4" cy="132" r="7.700000000000001" fill="#0E5E54"/>
    </g>
    </g>
    <rect x="0" y="0" width="92" height="30" fill="#2EC4B6"/>
    <text x="46" y="20" fill="white" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" text-anchor="middle">FIG. 13</text>
  </g>

  <!-- bottom rule + brand stamp -->
  <line x1="60" y1="820" x2="1140" y2="820" stroke="#0F1740" stroke-width="1" opacity="0.15"/>
  <circle cx="78" cy="858" r="12" fill="#6C3AED"/>
  <text x="100" y="864" fill="#0F1740" font-family="Georgia, serif" font-style="italic" font-size="16">Iter Advisors — DAF &amp; DRH externalisés</text>
  <text x="1140" y="864" fill="#0F1740" opacity="0.55" font-family="-apple-system, Inter, sans-serif" font-size="13" text-anchor="end" letter-spacing="0.5">iteradvisors.com/ressources/blog</text>
