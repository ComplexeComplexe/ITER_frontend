<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- masthead -->
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#0F1740" stroke-width="1" opacity="0.15"/>
  <text x="60" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3">ITER ADVISORS</text>
  <text x="1140" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3" text-anchor="end">VOL. 01 · 2026 · N° 26</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#0F1740" stroke-width="3"/>

  <!-- kicker + category badge -->
  <text x="60" y="115" fill="#3057E1" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3">BOITE A OUTILS</text>
  <rect x="60" y="135" width="165" height="34" rx="17" fill="#E5EBFF"/>
  <text x="142.5" y="157" fill="#1E3A8A" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" text-anchor="middle">OUTILS FINANCE</text>

  <!-- huge serif title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0F1740">
    <text x="60" y="230" font-size="72" font-weight="500" letter-spacing="-2">10 outils pour</text>
    <text x="60" y="308" font-size="72" font-weight="500" letter-spacing="-2">les CFOs startup</text>
  </g>

  <!-- accent rule under title -->
  <line x1="60" y1="326" x2="120" y2="326" stroke="#3057E1" stroke-width="4"/>

  <!-- italic subtitle -->
  <g font-family="Georgia, serif" fill="#4B5563" font-style="italic">
    <text x="60" y="360" font-size="24" font-weight="400">La boite a outils, classee et</text>
    <text x="60" y="392" font-size="24" font-weight="400">expliquee</text>
  </g>

  <!-- illustration block, right -->
  <g transform="translate(780 220)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="#E5EBFF"/>
    <g transform="translate(70 70)">
      <g stroke="#1E3A8A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="44" y="88" width="132" height="92.39999999999999" rx="4"/>
      <path d="M 83.6 88 L 83.6 66 L 136.4 66 L 136.4 88"/>
      <line x1="44" y1="121.00000000000001" x2="176" y2="121.00000000000001"/>
      <rect x="101.2" y="110" width="17.6" height="22" rx="1"/>
    </g>
    </g>
    <rect x="0" y="0" width="92" height="30" fill="#3057E1"/>
    <text x="46" y="20" fill="white" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" text-anchor="middle">FIG. 26</text>
  </g>

  <!-- bottom rule + brand stamp -->
  <line x1="60" y1="820" x2="1140" y2="820" stroke="#0F1740" stroke-width="1" opacity="0.15"/>
  <circle cx="78" cy="858" r="12" fill="#6C3AED"/>
  <text x="100" y="864" fill="#0F1740" font-family="Georgia, serif" font-style="italic" font-size="16">Iter Advisors — DAF &amp; DRH externalisés</text>
  <text x="1140" y="864" fill="#0F1740" opacity="0.55" font-family="-apple-system, Inter, sans-serif" font-size="13" text-anchor="end" letter-spacing="0.5">iteradvisors.com/ressources/blog</text>
