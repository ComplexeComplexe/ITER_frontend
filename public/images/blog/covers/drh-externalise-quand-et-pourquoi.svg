  <text x="60" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3">ITER ADVISORS</text>
  <text x="1140" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3" text-anchor="end">VOL. 01 · 2026 · N° 16</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#0F1740" stroke-width="3"/>

  <!-- kicker + category badge -->
  <text x="60" y="115" fill="#2E7D5B" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3">GUIDE</text>
  <rect x="60" y="135" width="51" height="34" rx="17" fill="#DDEEDC"/>
  <text x="85.5" y="157" fill="#1F5A3C" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" text-anchor="middle">RH</text>

  <!-- huge serif title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#0F1740">
