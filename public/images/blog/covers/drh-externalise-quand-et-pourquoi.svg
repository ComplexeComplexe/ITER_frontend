    <text x="60" y="308" font-size="72" font-weight="500" letter-spacing="-2">externalise</text>
  </g>

  <!-- accent rule under title -->
  <line x1="60" y1="326" x2="120" y2="326" stroke="#2E7D5B" stroke-width="4"/>

  <!-- italic subtitle -->
