    <text x="60" y="392" font-size="24" font-weight="400">paye</text>
  </g>

  <!-- illustration block, right -->
  <g transform="translate(780 220)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="#DDEEDC"/>
    <g transform="translate(70 70)">
      <g stroke="#1F5A3C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="70.4" cy="77" r="22"/>
      <path d="M 39.6 165 C 39.6 127.6, 101.2 127.6, 101.2 165"/>
      <circle cx="143" cy="70.4" r="17.6"/>
      <path d="M 121.00000000000001 158.4 C 121.00000000000001 121.00000000000001, 171.6 121.00000000000001, 171.6 158.4"/>
    </g>
    </g>
    <rect x="0" y="0" width="92" height="30" fill="#2E7D5B"/>
    <text x="46" y="20" fill="white" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" text-anchor="middle">FIG. 16</text>
