      <path d="M 110 44 L 171.6 44 L 187 61.60000000000001 L 171.6 79.2 L 110 79.2 Z"/>
      <path d="M 110 92.39999999999999 L 48.4 92.39999999999999 L 33 110 L 48.4 127.6 L 110 127.6 Z"/>
