<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">From the general ledger to management reporting</title><desc id="desc">Educational illustration. Entirely fictitious figures, in €000.</desc><rect width="1600" height="1170" fill="#f6f5fa"/><g font-family="Arial, sans-serif">
