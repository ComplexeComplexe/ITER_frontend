    <text x="60" y="230" font-size="72" font-weight="500" letter-spacing="-2">DAF externalise</text>
  </g>

  <!-- accent rule under title -->
  <line x1="60" y1="248" x2="120" y2="248" stroke="#6C3AED" stroke-width="4"/>

  <!-- italic subtitle -->
  <g font-family="Georgia, serif" fill="#4B5563" font-style="italic">
    <text x="60" y="282" font-size="24" font-weight="400">Le guide complet, tarifs et cas</text>
    <text x="60" y="314" font-size="24" font-weight="400">client</text>
  </g>

  <!-- illustration block, right -->
  <g transform="translate(780 220)">
    <rect x="0" y="0" width="360" height="360" rx="8" fill="#EFE7FF"/>
    <g transform="translate(70 70)">
      <g stroke="#3A1C8A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 110 55 C 66 39.6, 44 48.4, 44 55 L 44 171.6 C 44 165, 66 156.2, 110 171.6"/>
      <path d="M 110 55 C 154 39.6, 176 48.4, 176 55 L 176 171.6 C 176 165, 154 156.2, 110 171.6"/>
      <line x1="110" y1="55" x2="110" y2="171.6"/>
    </g>
    </g>
    <rect x="0" y="0" width="92" height="30" fill="#6C3AED"/>
    <text x="46" y="20" fill="white" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" text-anchor="middle">FIG. 28</text>
  </g>

  <!-- bottom rule + brand stamp -->
