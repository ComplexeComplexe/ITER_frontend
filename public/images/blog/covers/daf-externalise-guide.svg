  <text x="60" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3">ITER ADVISORS</text>
  <text x="1140" y="38" fill="#0F1740" font-family="Georgia, serif" font-size="13" letter-spacing="3" text-anchor="end">VOL. 01 · 2026 · N° 28</text>
  <line x1="60" y1="68" x2="1140" y2="68" stroke="#0F1740" stroke-width="3"/>

  <!-- kicker + category badge -->
  <text x="60" y="115" fill="#6C3AED" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3">GUIDE</text>
  <rect x="60" y="135" width="174.5" height="34" rx="17" fill="#EFE7FF"/>
  <text x="147.25" y="157" fill="#3A1C8A" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" text-anchor="middle">DAF EXTERNALISE</text>

  <!-- huge serif title -->
