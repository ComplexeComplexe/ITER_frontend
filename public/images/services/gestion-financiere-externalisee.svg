<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f5f7fa"/>

  <!-- Dashboard background -->
  <rect x="40" y="40" width="320" height="220" fill="#e8eef7" rx="8"/>

  <!-- Left sidebar -->
  <rect x="50" y="55" width="80" height="190" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>

  <!-- Sidebar items -->
  <circle cx="65" cy="75" r="3" fill="#4945ff"/>
  <line x1="75" y1="73" x2="115" y2="73" stroke="#7b7ddd" stroke-width="2"/>

  <circle cx="65" cy="105" r="3" fill="#d0d8e8"/>
  <line x1="75" y1="103" x2="115" y2="103" stroke="#d0d8e8" stroke-width="2"/>

  <circle cx="65" cy="135" r="3" fill="#d0d8e8"/>
  <line x1="75" y1="133" x2="115" y2="133" stroke="#d0d8e8" stroke-width="2"/>

  <!-- Main content area -->
  <rect x="145" y="55" width="205" height="190" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>

  <!-- Header of content area -->
  <line x1="155" y1="75" x2="335" y2="75" stroke="#d0d8e8" stroke-width="1"/>

  <!-- Metrics boxes -->
  <rect x="155" y="90" width="50" height="40" fill="#f0f2fa" rx="3"/>
  <text x="180" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#4945ff">€ 250K</text>

  <rect x="225" y="90" width="50" height="40" fill="#f0f2fa" rx="3"/>
  <text x="250" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#4945ff">+12%</text>

  <rect x="295" y="90" width="35" height="40" fill="#f0f2fa" rx="3"/>
  <text x="312" y="105" font-size="12" font-weight="bold" text-anchor="middle" fill="#4945ff">Jan</text>

  <!-- Mini chart -->
  <polyline points="155,155 175,145 195,150 215,130 235,140 255,120 275,130 295,110 315,125"
            fill="none" stroke="#7b7ddd" stroke-width="2"/>
  <circle cx="155" cy="155" r="2" fill="#4945ff"/>
  <circle cx="175" cy="145" r="2" fill="#4945ff"/>
  <circle cx="195" cy="150" r="2" fill="#4945ff"/>
  <circle cx="215" cy="130" r="2" fill="#4945ff"/>
  <circle cx="235" cy="140" r="2" fill="#4945ff"/>
  <circle cx="255" cy="120" r="2" fill="#4945ff"/>
  <circle cx="275" cy="130" r="2" fill="#4945ff"/>
  <circle cx="295" cy="110" r="2" fill="#4945ff"/>
  <circle cx="315" cy="125" r="2" fill="#4945ff"/>

  <!-- Title -->
  <text x="200" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Gestion Financière Externalisée
  </text>
</svg>
