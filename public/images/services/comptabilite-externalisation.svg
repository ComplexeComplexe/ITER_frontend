<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f5f7fa"/>

  <!-- Main document area -->
  <rect x="80" y="50" width="240" height="200" fill="#ffffff" rx="8" stroke="#d0d8e8" stroke-width="2"/>

  <!-- Document header -->
  <rect x="90" y="60" width="220" height="25" fill="#4945ff" rx="4"/>
  <text x="200" y="77" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">BILAN COMPTABLE</text>

  <!-- Document content rows -->
  <g>
    <!-- Row 1 -->
    <line x1="90" y1="95" x2="310" y2="95" stroke="#d0d8e8" stroke-width="1"/>
    <text x="100" y="110" font-size="11" fill="#4945ff" font-weight="bold">Actif</text>
    <text x="270" y="110" font-size="11" fill="#4945ff" font-weight="bold">€ 85K</text>

    <!-- Row 2 -->
    <line x1="90" y1="125" x2="310" y2="125" stroke="#d0d8e8" stroke-width="1"/>
    <text x="100" y="140" font-size="10" fill="#666">Immobilisations</text>
    <text x="270" y="140" font-size="10" fill="#666">€ 45K</text>

    <!-- Row 3 -->
    <line x1="90" y1="155" x2="310" y2="155" stroke="#d0d8e8" stroke-width="1"/>
    <text x="100" y="170" font-size="10" fill="#666">Créances clients</text>
    <text x="270" y="170" font-size="10" fill="#666">€ 40K</text>

    <!-- Row 4 -->
    <line x1="90" y1="185" x2="310" y2="185" stroke="#d0d8e8" stroke-width="1"/>
    <text x="100" y="200" font-size="10" fill="#666">Disponibilités</text>
    <text x="270" y="200" font-size="10" fill="#666">€ 25K</text>

    <!-- Row 5 -->
    <line x1="90" y1="215" x2="310" y2="215" stroke="#7b7ddd" stroke-width="2"/>
    <text x="100" y="230" font-size="11" fill="#7b7ddd" font-weight="bold">Passif</text>
    <text x="270" y="230" font-size="11" fill="#7b7ddd" font-weight="bold">€ 85K</text>
  </g>

  <!-- Document corner fold -->
  <polygon points="310,50 310,65 325,50" fill="#e8eef7"/>

  <!-- Title -->
  <text x="200" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Externalisation Comptabilité
  </text>
</svg>
