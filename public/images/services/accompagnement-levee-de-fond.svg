<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f5f7fa"/>

  <!-- Upward arrow background -->
  <path d="M 100 200 L 200 80 L 300 200" fill="none" stroke="#e8eef7" stroke-width="3"/>

  <!-- Milestone circles -->
  <circle cx="100" cy="200" r="20" fill="#4945ff"/>
  <text x="100" y="208" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Seed</text>

  <circle cx="160" cy="150" r="18" fill="#7b7ddd"/>
  <text x="160" y="157" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Series</text>

  <circle cx="200" cy="100" r="22" fill="#4945ff"/>
  <text x="200" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text>

  <circle cx="240" cy="140" r="18" fill="#7b7ddd"/>
  <text x="240" y="147" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Series</text>

  <circle cx="300" cy="200" r="20" fill="#4945ff"/>
  <text x="300" y="208" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Growth</text>

  <!-- Growth indicators -->
  <text x="140" y="130" font-size="10" fill="#666" font-weight="bold">€500K</text>
  <text x="190" y="65" font-size="10" fill="#666" font-weight="bold">€3M</text>
  <text x="260" y="110" font-size="10" fill="#666" font-weight="bold">€8M</text>

  <!-- Connecting lines -->
  <line x1="118" y1="188" x2="145" y2="162" stroke="#7b7ddd" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="175" y1="135" x2="188" y2="118" stroke="#7b7ddd" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="218" y1="110" x2="235" y2="132" stroke="#7b7ddd" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="258" y1="160" x2="283" y2="188" stroke="#7b7ddd" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Title -->
  <text x="200" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Accompagnement Levée de Fonds
  </text>
</svg>
