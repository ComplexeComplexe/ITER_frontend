<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f5f7fa"/>

  <!-- Main dashboard grid -->
  <rect x="50" y="50" width="300" height="180" fill="#e8eef7" rx="8"/>

  <!-- Top row - 3 KPI cards -->
  <rect x="60" y="60" width="85" height="70" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>
  <text x="102" y="78" font-size="10" fill="#666" text-anchor="middle">Revenue</text>
  <text x="102" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#4945ff">€245K</text>
  <text x="102" y="118" font-size="9" fill="#7b7ddd" text-anchor="middle">+8.2%</text>

  <rect x="158" y="60" width="85" height="70" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>
  <text x="200" y="78" font-size="10" fill="#666" text-anchor="middle">EBITDA</text>
  <text x="200" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#4945ff">32%</text>
  <text x="200" y="118" font-size="9" fill="#7b7ddd" text-anchor="middle">+2.1%</text>

  <rect x="256" y="60" width="85" height="70" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>
  <text x="298" y="78" font-size="10" fill="#666" text-anchor="middle">Margin</text>
  <text x="298" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#4945ff">28%</text>
  <text x="298" y="118" font-size="9" fill="#7b7ddd" text-anchor="middle">-1.3%</text>

  <!-- Bottom row - Budget variance chart -->
  <rect x="60" y="145" width="280" height="75" fill="#ffffff" rx="4" stroke="#d0d8e8" stroke-width="1"/>

  <!-- Chart label -->
  <text x="70" y="160" font-size="10" fill="#666" font-weight="bold">Budget vs Réalité</text>

  <!-- Budget bars -->
  <g>
    <!-- Bar 1 -->
    <rect x="80" y="180" width="8" height="30" fill="#4945ff"/>
    <rect x="91" y="190" width="8" height="20" fill="#7b7ddd"/>
    <text x="95" y="220" font-size="8" fill="#666" text-anchor="middle">Jan</text>

    <!-- Bar 2 -->
    <rect x="120" y="175" width="8" height="35" fill="#4945ff"/>
    <rect x="131" y="180" width="8" height="30" fill="#7b7ddd"/>
    <text x="135" y="220" font-size="8" fill="#666" text-anchor="middle">Feb</text>

    <!-- Bar 3 -->
    <rect x="160" y="170" width="8" height="40" fill="#4945ff"/>
    <rect x="171" y="185" width="8" height="25" fill="#7b7ddd"/>
    <text x="175" y="220" font-size="8" fill="#666" text-anchor="middle">Mar</text>

    <!-- Bar 4 -->
    <rect x="200" y="165" width="8" height="45" fill="#4945ff"/>
    <rect x="211" y="190" width="8" height="20" fill="#7b7ddd"/>
    <text x="215" y="220" font-size="8" fill="#666" text-anchor="middle">Apr</text>
  </g>

  <!-- Legend -->
  <rect x="280" y="175" width="6" height="6" fill="#4945ff"/>
  <text x="290" y="179" font-size="8" fill="#666">Budget</text>

  <rect x="280" y="190" width="6" height="6" fill="#7b7ddd"/>
  <text x="290" y="194" font-size="8" fill="#666">Réalité</text>

  <!-- Title -->
  <text x="200" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Contrôle de Gestion Externalisé
  </text>
</svg>
